# Render.com deployment configuration
# https://render.com/docs/blueprint-spec

services:
  # Go Backend Service
  - type: web
    name: titan-ledger
    runtime: go
    repo: https://github.com/JullMol/titan-ledger
    buildCommand: go build -o titan-ledger ./cmd/api
    startCommand: ./titan-ledger
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: titan-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: titan-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: titan-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: titan-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: titan-db
          property: database
    healthCheckPath: /health

databases:
  - name: titan-db
    databaseName: titan_ledger
    user: titan_user
    plan: free
